name: diag-subtitle

# 临时诊断：定位 CI 上 subtitle_test.dart 整批 did not complete 的原因。
# 本文件用完即删，不进主线常规流程。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - name: pub get
        run: flutter pub get
      - name: 单独跑 subtitle_test（串行）
        run: flutter test test/subtitle_test.dart --reporter expanded --concurrency=1
      - name: 单独跑 subtitle_test（默认并发）
        if: always()
        run: flutter test test/subtitle_test.dart --reporter compact
      - name: 全量串行并记录退出码
        if: always()
        run: |
          flutter test --reporter compact --concurrency=1
          echo "EXIT=$LASTEXITCODE"
        continue-on-error: true
