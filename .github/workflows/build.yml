name: build

on:
  push:
    branches: [mod, main]
  pull_request:
    branches: [mod, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze + test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "--- 第 $attempt 次尝试"
            if flutter test --reporter compact --concurrency=1; then
              echo "测试通过（第 $attempt 次）"
              exit 0
            fi
            echo "::warning::第 $attempt 次测试失败，重试"
          done
          echo "::error::连续 3 次测试失败，判定为真实失败"
          exit 1

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v

  windows:
    name: windows release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: 预安装 flutter_inappwebview_windows 原生依赖
        shell: pwsh
        run: |
          $pkgDir = (Resolve-Path ".").Path + "\build\windows\x64\packages"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null

          nuget install Microsoft.Windows.ImplementationLibrary -Version 1.0.231216.1 -ExcludeVersion -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "nuget install WIL failed" }
          nuget install Microsoft.Web.WebView2 -Version 1.0.2792.45 -ExcludeVersion -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "nuget install WebView2 failed" }
          nuget install nlohmann.json -Version 3.11.2 -ExcludeVersion -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw "nuget install nlohmann.json failed" }

          $inc1 = "$pkgDir\Microsoft.Web.WebView2\build\native\include"
          $inc2 = "$pkgDir\Microsoft.Windows.ImplementationLibrary\include"
          $inc3 = "$pkgDir\nlohmann.json\build\native\include"
          foreach ($d in @($inc1, $inc2, $inc3)) {
            if (-not (Test-Path $d)) { throw "头文件目录缺失: $d" }
          }
          $clFlags = "/I`"$inc1`" /I`"$inc2`" /I`"$inc3`""
          if ($env:CL) { $clFlags = "$env:CL $clFlags" }
          "CL=$clFlags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Exported CL=$clFlags"

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包（排除 userdata）
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "构建产物不存在：$src" }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $path = Join-Path $src $dll
            if (-not (Test-Path $path)) { throw "缺少 VC++ 运行库：$path（未装 vc_redist 的用户会闪退）" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "misatv-win"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $stage -Recurse -Force -Exclude 'userdata'
          $zip = "MisaTV-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          $bad = @($a.Entries | Where-Object { $_.FullName -like 'userdata*' })
          $count = $a.Entries.Count
          $a.Dispose()
          if ($bad.Count -gt 0) { throw "发布包含有 userdata：$($bad.FullName -join ', ')" }
          Write-Host "文件数=$count 体积=$((Get-Item $zip).Length) 字节"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MisaTV-windows-x64
          path: MisaTV-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: 挂到 Release 资产
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "MisaTV-windows-x64.zip" --clobber

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v
