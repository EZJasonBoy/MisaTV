name: build

on:
  # main 也纳入：此前只监听 mod，导致合并到 main 的改动完全没有 CI 兜底
  # （曾有 20 个编译错误的提交差点直接进 main）。
  push:
    branches: [mod, main]
  pull_request:
    branches: [mod, main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze + test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        # 固定串行：多 isolate 并行时整套测试偶发被整体中止，受害者随机
        # （表现为某个 test 文件整批 did not complete，单跑该文件却全过）。
        # 并行约 85s、串行约 4min，用这点时间换确定的绿灯。
        run: flutter test --reporter compact --concurrency=1

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v

  windows:
    name: windows release
    # 固定在 VS 2022 镜像：windows-latest 已是 VS 2026（MSVC 14.51），
    # flutter_inappwebview_windows 依赖 <experimental/coroutine>，在 VS 2026 下是硬错误。
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MisaTV-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v
