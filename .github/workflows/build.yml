name: build

on:
  push:
    branches: [mod, main]
  pull_request:
    branches: [mod, main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: analyze + test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 环境信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "--- 第 $attempt 次尝试"
            if flutter test --reporter compact --concurrency=1; then
              echo "测试通过（第 $attempt 次）"
              exit 0
            fi
            echo "::warning::第 $attempt 次测试失败，重试"
          done
          echo "::error::连续 3 次测试失败，判定为真实失败"
          exit 1

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v

  windows:
    name: windows release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: 预安装 flutter_inappwebview_windows 原生依赖
        shell: pwsh
        run: |
          $pkgDir = (Resolve-Path ".").Path + "\build\windows\x64\packages"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null

          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA "Pub\Cache" }
          $cmake = Get-ChildItem -Path (Join-Path $pubCache "hosted\pub.dev") -Directory -Filter "flutter_inappwebview_windows-*" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "windows\CMakeLists.txt" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          $content = ""
          if ($cmake) {
            Write-Host "Found CMakeLists.txt: $cmake"
            $content = Get-Content $cmake -Raw
            ($content -split "`n" | Select-Object -First 50) -join "`n" | Write-Host
          }

          $pkgs = @(
            'Microsoft.Web.WebView2',
            'Microsoft.Windows.ImplementationLibrary',
            'nlohmann.json'
          )

          foreach ($pkg in $pkgs) {
            $ver = $null
            if ($content -match ([regex]::Escape($pkg) + '[^\r\n]*?(?:-Version\s+|VERSION\s+)([0-9]+\.[0-9A-Za-z.\-]+)')) {
              $ver = $Matches[1]
            }
            if ($ver) {
              Write-Host "Installing $pkg $ver (versioned + unversioned) ..."
              nuget install $pkg -Version $ver -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
              nuget install $pkg -Version $ver -ExcludeVersion -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
            } else {
              Write-Host "Installing $pkg (latest, versioned + unversioned) ..."
              nuget install $pkg -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
              nuget install $pkg -ExcludeVersion -OutputDirectory $pkgDir -Source https://api.nuget.org/v3/index.json
            }
            if ($LASTEXITCODE -ne 0) { throw "nuget install $pkg failed" }
          }

          $incDirs = @()
          $wv2 = Get-ChildItem -Path $pkgDir -Recurse -Filter "WebView2.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          $wil = Get-ChildItem -Path $pkgDir -Recurse -Filter "com.h" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "wil" } | Select-Object -First 1
          $json = Get-ChildItem -Path $pkgDir -Recurse -Filter "json.hpp" -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq "nlohmann" } | Select-Object -First 1

          if ($wv2)  { $incDirs += $wv2.Directory.FullName }
          if ($wil)  { $incDirs += $wil.Directory.Parent.FullName }
          if ($json) { $incDirs += $json.Directory.Parent.FullName }

          Write-Host "Injected INCLUDE dirs: $($incDirs -join ';')"
          if (-not $wv2 -or -not $json) { throw "预安装头文件缺失" }

          $newInclude = ($incDirs -join ';')
          if ($env:INCLUDE) { $newInclude = "$newInclude;$env:INCLUDE" }
          "INCLUDE=$newInclude" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包（排除 userdata）
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "构建产物不存在：$src" }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $path = Join-Path $src $dll
            if (-not (Test-Path $path)) { throw "缺少 VC++ 运行库：$path（未装 vc_redist 的用户会闪退）" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "misatv-win"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $stage -Recurse -Force -Exclude 'userdata'
          $zip = "MisaTV-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          $bad = @($a.Entries | Where-Object { $_.FullName -like 'userdata*' })
          $count = $a.Entries.Count
          $a.Dispose()
          if ($bad.Count -gt 0) { throw "发布包含有 userdata：$($bad.FullName -join ', ')" }
          Write-Host "文件数=$count 体积=$((Get-Item $zip).Length) 字节"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MisaTV-windows-x64
          path: MisaTV-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: 挂到 Release 资产
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "MisaTV-windows-x64.zip" --clobber

      - name: 失败时打印诊断
        if: failure()
        run: flutter doctor -v
